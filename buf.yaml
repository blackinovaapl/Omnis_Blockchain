version: v2
modules:
  - path: proto
    name: buf.build/shubham/omnis
  - path: third_party/proto
    name: buf.build/shubham/third_party
deps:
  - buf.build/cosmos/cosmos-sdk
  - buf.build/cosmos/gogo-proto
  - buf.build/googleapis/googleapis
lint:
  except:
    - FIELD_NOT_REQUIRED
    - PACKAGE_NO_IMPORT_CYCLE
  disallow_comment_ignores: true
breaking:
  except:
    - EXTENSION_NO_DELETE
    - FIELD_SAME_DEFAULT
